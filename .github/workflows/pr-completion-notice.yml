name: CSL completion notice
on:
  workflow_call:
    secrets:
      CSL_HUB_NOTICE_TOKEN:
        required: true
      CSL_NATS_CI_CREDS:
        required: false
permissions:
  contents: read
  pull-requests: read
jobs:
  notify:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.status == 'completed' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: csl-ci-notices
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Load trusted notice client
        id: trusted-checkout
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vitral-ai/context-session-librarian
          ref: 0d8a4d7da04f70d1396168b7af9e162d5d78b41d
          persist-credentials: false
          sparse-checkout: |
            csl_ci_notice.py
            csl_bridge_store.py
            nats-control
          sparse-checkout-cone-mode: false
      - name: Set up the pinned Go toolchain
        timeout-minutes: 1
        if: ${{ vars.CSL_NATS_CI_URL != '' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build trusted NATS publisher
        timeout-minutes: 1
        if: ${{ vars.CSL_NATS_CI_URL != '' }}
        working-directory: nats-control
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/csl-ci-notice" ./cmd/csl-ci-notice
      - name: Post completion once per configured transport
        timeout-minutes: 2
        if: ${{ !cancelled() && steps.trusted-checkout.outcome == 'success' }}
        env:
          CSL_GITHUB_TOKEN: ${{ github.token }}
          CSL_EVENT: ${{ toJSON(github.event) }}
          CSL_REPOSITORY: ${{ github.repository }}
          CSL_REPOSITORY_ID: ${{ github.repository_id }}
          CSL_HUB_URL: ${{ vars.CSL_HUB_URL }}
          CSL_HUB_CA_PEM: ${{ vars.CSL_HUB_CA_PEM }}
          CSL_HUB_NOTICE_TOKEN: ${{ secrets.CSL_HUB_NOTICE_TOKEN }}
          CSL_NATS_CI_CREDS: ${{ secrets.CSL_NATS_CI_CREDS }}
          CSL_NATS_CI_URL: ${{ vars.CSL_NATS_CI_URL }}
          CSL_NATS_CI_CA_PEM: ${{ vars.CSL_NATS_CI_CA_PEM }}
          CSL_NATS_CI_ROUTES: ${{ vars.CSL_NATS_CI_ROUTES }}
          CSL_NATS_CI_PUBLISHER: ${{ runner.temp }}/csl-ci-notice
        run: python3 csl_ci_notice.py
