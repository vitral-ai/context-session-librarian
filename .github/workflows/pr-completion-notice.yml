name: CSL completion notice
on:
  workflow_call:
    secrets:
      CSL_HUB_NOTICE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  notify:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.status == 'completed' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: csl-ci-notices
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Load trusted notice client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vitral-ai/context-session-librarian
          ref: 0ec961875b7e21857fc3853868d78699f3e21b05
          persist-credentials: false
          sparse-checkout: |
            csl_ci_notice.py
            csl_bridge_store.py
          sparse-checkout-cone-mode: false
      - name: Post completion once
        env:
          CSL_EVENT: ${{ toJSON(github.event) }}
          CSL_REPOSITORY: ${{ github.repository }}
          CSL_REPOSITORY_ID: ${{ github.repository_id }}
          CSL_HUB_URL: ${{ vars.CSL_HUB_URL }}
          CSL_HUB_CA_PEM: ${{ vars.CSL_HUB_CA_PEM }}
          CSL_HUB_NOTICE_TOKEN: ${{ secrets.CSL_HUB_NOTICE_TOKEN }}
        run: python3 csl_ci_notice.py
