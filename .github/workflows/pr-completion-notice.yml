name: CSL completion notice
on:
  workflow_call:
    secrets:
      CSL_HUB_NOTICE_TOKEN:
        required: true
      CSL_NATS_CI_CREDS:
        required: false
permissions:
  contents: read
  pull-requests: read
jobs:
  notify:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.status == 'completed' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: csl-ci-notices
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load trusted notice client
        id: trusted-checkout
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vitral-ai/context-session-librarian
          ref: 0d8a4d7da04f70d1396168b7af9e162d5d78b41d
          persist-credentials: false
          sparse-checkout: |
            csl_ci_notice.py
            csl_bridge_store.py
            nats-control
          sparse-checkout-cone-mode: false
      - name: Post Hub completion
        timeout-minutes: 2
        env:
          CSL_GITHUB_TOKEN: ${{ github.token }}
          CSL_EVENT: ${{ toJSON(github.event) }}
          CSL_REPOSITORY: ${{ github.repository }}
          CSL_REPOSITORY_ID: ${{ github.repository_id }}
          CSL_HUB_URL: ${{ vars.CSL_HUB_URL }}
          CSL_HUB_CA_PEM: ${{ vars.CSL_HUB_CA_PEM }}
          CSL_HUB_NOTICE_TOKEN: ${{ secrets.CSL_HUB_NOTICE_TOKEN }}
        run: python3 csl_ci_notice.py
      - name: Set up the pinned Go toolchain
        id: nats-toolchain
        if: ${{ !cancelled() && steps.trusted-checkout.outcome == 'success' && vars.CSL_NATS_CI_URL != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GOTOOLCHAIN: go1.27.4
        run: timeout --signal=KILL 90s go version
      - name: Build trusted NATS publisher
        id: nats-build
        if: ${{ !cancelled() && steps.nats-toolchain.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        working-directory: nats-control
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: go1.27.4
        run: timeout --signal=KILL 90s go build -mod=readonly -trimpath -o "$RUNNER_TEMP/csl-ci-notice" ./cmd/csl-ci-notice
      - name: Post NATS completion
        if: ${{ !cancelled() && steps.nats-build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          CSL_GITHUB_TOKEN: ${{ github.token }}
          CSL_EVENT: ${{ toJSON(github.event) }}
          CSL_REPOSITORY: ${{ github.repository }}
          CSL_REPOSITORY_ID: ${{ github.repository_id }}
          CSL_NATS_CI_CREDS: ${{ secrets.CSL_NATS_CI_CREDS }}
          CSL_NATS_CI_URL: ${{ vars.CSL_NATS_CI_URL }}
          CSL_NATS_CI_CA_PEM: ${{ vars.CSL_NATS_CI_CA_PEM }}
          CSL_NATS_CI_ROUTES: ${{ vars.CSL_NATS_CI_ROUTES }}
          CSL_NATS_CI_PUBLISHER: ${{ runner.temp }}/csl-ci-notice
        run: |
          timeout --signal=KILL 30s python3 - <<'PY'
          import os
          from csl_ci_notice import current_head_allows_notice, post_nats, workflow_notice

          notice = workflow_notice(os.environ)
          if current_head_allows_notice(notice, os.environ):
              post_nats(notice, os.environ)
          PY
