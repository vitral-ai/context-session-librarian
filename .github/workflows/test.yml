name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Superseded PR revisions must not consume a second complete validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Import every root CLI entry point and check curses-free startup
        run: python -m unittest discover -s tests -p test_cli_startup.py -v
  transfer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Require execution language-pair fixture
        run: go version
      - run: echo 'CSL_REQUIRE_EXECUTION_PROCESS_TESTS=1' >> "$GITHUB_ENV"
      - name: Install pinned Helm for packaging tests
        run: |
          mkdir -p "$RUNNER_TEMP/csl-helm"
          cd "$RUNNER_TEMP/csl-helm"
          curl --fail --silent --show-error --max-time 60 \
            -o helm.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          printf '%s  helm.tar.gz\n' a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496 | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          "$PWD/linux-amd64/helm" version --short
          openssl version
          printf 'VITRAL_FIXTURE_HELM=%s/linux-amd64/helm\n' "$PWD" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
  media:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r media-test-requirements.txt
      - name: Install pinned Helm for packaging tests
        run: |
          mkdir -p "$RUNNER_TEMP/csl-helm"
          cd "$RUNNER_TEMP/csl-helm"
          curl --fail --silent --show-error --max-time 60 \
            -o helm.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          printf '%s  helm.tar.gz\n' a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496 | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          "$PWD/linux-amd64/helm" version --short
          openssl version
          printf 'VITRAL_FIXTURE_HELM=%s/linux-amd64/helm\n' "$PWD" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
        env:
          CSL_RUN_MEDIA_TESTS: '1'
          # Generated fixtures are trusted; hosted runner namespace support varies.
          CSL_MEDIA_SANDBOX: process

  nats-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nats-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: nats-control/go.sum
      - run: go install github.com/nats-io/nats-server/v2@v2.15.3
      - run: CSL_TEST_NATS="$(go env GOPATH)/bin/nats-server" go test -race ./...
