name: Notify source agent of CI completion
on:
  workflow_run:
    workflows: ["Tests", "Workload image source"]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
jobs:
  notify:
    if: ${{ (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target') && github.event.workflow_run.conclusion != 'cancelled' }}
    uses: vitral-ai/context-session-librarian/.github/workflows/pr-completion-notice.yml@449b63352ff66a8a232654bc0da6e58b28cc427a
    secrets:
      CSL_HUB_NOTICE_TOKEN: ${{ secrets.CSL_HUB_NOTICE_TOKEN }}
      CSL_NATS_CI_CREDS: ${{ secrets.CSL_NATS_CI_CREDS }}
