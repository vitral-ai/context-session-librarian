enabled: false
mode: sidecar
collector:
  image: ""
  uid: 10001
  stateLimit: 256Mi
  spoolLimitBytes: 134217728
  flushSeconds: 20
transcripts:
  provider: ""
  profile: ""
  sizeLimit: 512Mi
identity:
  origin: ""
  caConfigMap: ""
location:
  provider: kubernetes
  label: ""
  cluster: ""
  workload: ""
writer:
  image: ""
  command: []
  args: []
  shutdownSeconds: 15
terminationGracePeriodSeconds: 40
daemonSet:
  narrowSameOwnerExport: false
  existingClaim: ""
# One-container Job: the reviewed Claude sole-producer gate (packaging/claude-sole-producer)
# runs claude under the Runner, so final flush completes. Enroll and start through kubectl exec.
soleProducer:
  image: ""
  expectSession: ""
  credentialSecret: ""
  credentialKey: token
  prepareSeconds: 900
  args: []
# Collector phase 2: one container-terminal host (vitralai host-agent container mode)
# whose shared tmux terminal runs the workload. Device code in the pod log.
terminalHost:
  image: ""
  path: host-agent
  expectedOwner: ""
  # Optional: point the host at another stack (e.g. local Tilt); empty keeps the image's DEV defaults.
  issuer: ""
  gatewayUrl: ""
  # Optional: a collector native sidecar streams the shared terminal's Claude transcripts
  # (transcript emptyDir at /agent-transcripts; the workload links CLAUDE_CONFIG_DIR/projects to it).
  collector: false
  credentialSecret: ""
  credentialKey: CLAUDE_CODE_OAUTH_TOKEN
  storage: 1Gi
  args: []
